<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Vaultify | الدفع</title><style>:root{--bg:#071217;--p:#0d1b21;--l:#203941;--t:#eef7f4;--m:#8fa5aa;--g:#6ee7b7;--bad:#ff8a93}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#12382d 0,transparent 28%),var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}.wrap{max-width:920px;margin:auto;padding:28px}.brand{font-weight:900;color:var(--g);font-size:26px}.sub{color:var(--m);margin:7px 0 25px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:linear-gradient(180deg,#10252b,#0b1b20);border:1px solid var(--l);border-radius:18px;padding:20px}.card.selected{border-color:#2d8468;box-shadow:0 0 0 1px #2d8468 inset}.price{font-size:28px;font-weight:900;margin:10px 0}.muted{color:var(--m);font-size:13px;line-height:1.7}.btn{width:100%;border:0;border-radius:13px;padding:14px;background:linear-gradient(90deg,#35c995,#6ee7b7);color:#062018;font-weight:900;cursor:pointer;margin-top:12px}.ghost{display:inline-block;color:#bcd0d3;text-decoration:none;margin-bottom:18px}.status{margin-top:18px;padding:14px;border-radius:13px;background:#102329;color:#bcd0d3}.error{background:#35171c;color:#ffd0d4}.choice{margin:20px 0;display:flex;gap:9px;flex-wrap:wrap}.choice button{border:1px solid var(--l);background:#0c1b21;color:#c7d7d9;border-radius:999px;padding:9px 13px}.choice button.active{border-color:#2d8468;background:#11372d;color:#dffff2}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:18px}}</style></head><body><div class="wrap"><a href="/dashboard#billing" class="ghost">← العودة للاشتراك والفوترة</a><div class="brand">Vaultify | فولتڤاي</div><div class="sub">Sandbox Checkout · لا يتم خصم أموال حقيقية في هذه المرحلة.</div><div class="choice"><button class="active" data-charge="setup_plus_monthly">التأسيس + أول شهر</button><button data-charge="monthly">شهري فقط</button><button data-charge="setup">التأسيس فقط</button></div><div id="plans" class="grid"></div><div id="status" class="status">اختر الباقة ثم اضغط بدء الدفع التجريبي.</div></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const URL='https://ittixiicaeizihyzawju.supabase.co',KEY='sb_publishable_SIlfF6-ctdJL2WTg3eTlKQ_5F3LKsSl',sb=createClient(URL,KEY,{auth:{persistSession:true,detectSessionInUrl:true}});const plans=[{id:'standard',name:'Standard',setup:2990,monthly:690},{id:'growth',name:'Growth',setup:4990,monthly:1190},{id:'custom',name:'Custom',setup:7500,monthly:1490}],el=document.getElementById('plans'),st=document.getElementById('status');let charge='setup_plus_monthly';document.querySelectorAll('[data-charge]').forEach(b=>b.onclick=()=>{charge=b.dataset.charge;document.querySelectorAll('[data-charge]').forEach(x=>x.classList.toggle('active',x===b));render()});const money=n=>new Intl.NumberFormat('ar-SA').format(n)+' ر.س';function amt(p){return charge==='setup'?p.setup:charge==='monthly'?p.monthly:p.setup+p.monthly}function render(){el.innerHTML=plans.map(p=>`<div class="card"><b>${p.name}</b><div class="price">${money(amt(p))}</div><div class="muted">تأسيس ${money(p.setup)} · شهري ${money(p.monthly)}</div><button class="btn" data-plan="${p.id}">بدء الدفع التجريبي</button></div>`).join('');document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>start(b.dataset.plan,b))}async function start(plan,btn){btn.disabled=true;st.className='status';st.textContent='جارٍ إنشاء رابط دفع آمن من ميسر…';const{data:{session}}=await sb.auth.getSession();if(!session){location.href='/login-v2.html';return}try{const r=await fetch(URL+'/functions/v1/moyasar-create-checkout',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({plan_id:plan,charge_type:charge})});const j=await r.json();if(!r.ok)throw new Error(j.error+(j.detail?': '+JSON.stringify(j.detail):''));sessionStorage.setItem('vaultify_last_intent',j.intent_id);location.href=j.checkout_url}catch(e){st.className='status error';st.textContent='تعذر إنشاء الدفع: '+e.message;btn.disabled=false}}render();</script></body></html>
