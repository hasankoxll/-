<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Vaultify | تسجيل الدخول</title><style>:root{--bg:#071115;--p:#0d1b20;--l:#20363d;--t:#f4f8f7;--m:#91a5ab;--g:#6fe0b0;--r:#ff7e8a}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 75% -10%,rgba(54,159,124,.18),transparent 30%),var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}.box{width:min(92vw,470px);padding:30px;border:1px solid var(--l);border-radius:24px;background:rgba(13,27,32,.96);box-shadow:0 30px 100px rgba(0,0,0,.3)}.brand{font-size:26px;font-weight:900;color:var(--g)}h1{margin:28px 0 8px;font-size:30px}.lead{color:var(--m);line-height:1.8}.field{margin-top:20px}label{display:block;color:#bdcbd0;font-size:13px;margin-bottom:8px}input{width:100%;height:52px;border:1px solid #2a424a;border-radius:13px;background:#09181c;color:white;padding:0 14px;font:inherit;outline:0}input:focus{border-color:#3d9778}button{width:100%;height:54px;border:0;border-radius:13px;background:var(--g);color:#06130f;font:inherit;font-weight:900;margin-top:14px;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.status{margin-top:15px;padding:12px 14px;border:1px solid var(--l);border-radius:12px;color:var(--m);font-size:13px;line-height:1.7}.error{color:#ffd1d5;border-color:#7f3740}.ok{color:#bcf2d9;border-color:#2b7059}.tiny{margin-top:18px;font-size:11px;color:#6f858c;line-height:1.7}</style></head><body><div class="box"><div class="brand">Vaultify | فولتڤاي</div><h1>الدخول إلى Revenue OS</h1><div class="lead">أدخل بريدك وسنرسل رابط دخول آمن. لا نخزن كلمة مرور في Vaultify.</div><div class="field"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" placeholder="name@company.com"></div><button id="send">إرسال رابط الدخول</button><div id="status" class="status">سيتم ربط حسابك بنشاطك فقط بعد المصادقة.</div><div class="tiny">الدخول محمي عبر Supabase Auth + Row Level Security. كل مستخدم يرى بيانات الـTenant المصرح له به فقط.</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://ittixiicaeizihyzawju.supabase.co';const KEY='sb_publishable_SIlfF6-ctdJL2WTg3eTlKQ_5F3LKsSl';const sb=supabase.createClient(URL,KEY);const btn=document.getElementById('send'),st=document.getElementById('status');
(async()=>{const {data}=await sb.auth.getSession();if(data?.session){location.replace('/dashboard.html')}})();
btn.onclick=async()=>{const email=document.getElementById('email').value.trim();if(!email){st.textContent='اكتب البريد الإلكتروني أولًا.';st.className='status error';return}btn.disabled=true;st.textContent='جارٍ إرسال رابط الدخول...';st.className='status';const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+'/dashboard.html',shouldCreateUser:true}});if(error){st.textContent='تعذر إرسال الرابط: '+error.message;st.className='status error';btn.disabled=false;return}st.textContent='تم إرسال رابط الدخول. افتح بريدك واضغط الرابط ثم ستنتقل للوحة Vaultify.';st.className='status ok';btn.disabled=false};
</script></body></html>
