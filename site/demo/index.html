<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>احجز Demo | Vaultify</title><meta name="description" content="احجز عرض Vaultify لتقييم مسار المبيعات والأتمتة والذكاء الاصطناعي في نشاطك."><link rel="canonical" href="https://platform.getvaultify.io/site/demo/"><style>body{margin:0;background:#070b10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Tahoma,Arial,sans-serif}.w{width:min(760px,92vw);margin:auto;padding:44px 0}.card{border:1px solid #202c3a;background:#0d131b;border-radius:22px;padding:24px}h1{font-size:40px;margin:0 0 8px}.muted{color:#95a5b8}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.full{grid-column:1/-1}input,select,textarea,button{font:inherit;border-radius:12px;padding:13px;border:1px solid #2a3947;background:#091018;color:#fff}textarea{min-height:100px}.submit{grid-column:1/-1;background:#6fe0b0;color:#06140f;border:0;font-weight:900;cursor:pointer}.status{grid-column:1/-1;color:#9eacba;font-size:13px}a{color:#6fe0b0;text-decoration:none}@media(max-width:650px){.form{grid-template-columns:1fr}.full,.submit{grid-column:1}}</style></head><body><main class="w"><a href="/site/">← الرئيسية</a><div class="card"><h1>احجز Demo</h1><p class="muted">أرسل بيانات نشاطك والوقت المناسب. الطلب يدخل مباشرة إلى Vaultify CRM ويُنشئ مهمة متابعة للمبيعات.</p><form id="f" class="form"><input name="name" placeholder="الاسم" required><input name="company" placeholder="اسم النشاط"><input name="phone" placeholder="05xxxxxxxx" inputmode="tel"><input name="email" placeholder="البريد" type="email"><select name="business_type"><option value="">نوع النشاط</option><option>عيادة</option><option>عقار</option><option>سيارات</option><option>مقاولات</option><option>خدمات</option><option>تجارة إلكترونية</option><option>أخرى</option></select><select name="monthly_leads"><option value="0">العملاء المحتملون شهريًا</option><option value="20">أقل من 50</option><option value="100">50–200</option><option value="500">200–1000</option><option value="1500">أكثر من 1000</option></select><input class="full" name="preferred_time" placeholder="الوقت المفضل للاجتماع (مثال: الأحد 7 مساءً)"><textarea class="full" name="goal" placeholder="ما أهم مشكلة مبيعات أو متابعة تريد حلها؟"></textarea><input name="website" style="display:none" tabindex="-1"><button class="submit" type="submit">إرسال طلب الـDemo</button><div id="s" class="status">لن نطلب دفعًا في هذه الخطوة.</div></form></div></main><script>const f=document.getElementById('f'),s=document.getElementById('s');f.addEventListener('submit',async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(f).entries());if(!x.phone&&!x.email){s.textContent='أدخل رقم الجوال أو البريد.';return}s.textContent='جارٍ تسجيل الطلب...';const goal=[x.goal||'',x.preferred_time?'وقت Demo المفضل: '+x.preferred_time:''].filter(Boolean).join('\n');try{const r=await fetch('https://ittixiicaeizihyzawju.supabase.co/functions/v1/site-lead',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...x,goal,monthly_leads:Number(x.monthly_leads||0),locale:'ar',page:location.pathname,utm:Object.fromEntries(new URLSearchParams(location.search))})});if(!r.ok)throw new Error();s.textContent='تم تسجيل طلبك بنجاح ✓';f.reset()}catch{ s.textContent='تعذر الإرسال الآن. حاول مرة أخرى.'}});</script></body></html>
