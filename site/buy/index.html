<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ابدأ مع Vaultify</title><meta name="description" content="اختر باقة Vaultify واطلب رابط دفع آمن مرتبط بعرضك."><link rel="canonical" href="https://platform.getvaultify.io/site/buy/"><style>body{margin:0;background:#070b10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Tahoma,Arial,sans-serif}.w{width:min(820px,92vw);margin:auto;padding:44px 0}.card{border:1px solid #202c3a;background:#0d131b;border-radius:22px;padding:24px}.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.p{border:1px solid #2a3947;border-radius:14px;padding:14px}.p b{font-size:20px}.muted{color:#95a5b8}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,button{font:inherit;border-radius:12px;padding:13px;border:1px solid #2a3947;background:#091018;color:#fff}.submit{grid-column:1/-1;background:#6fe0b0;color:#06140f;border:0;font-weight:900}.status{grid-column:1/-1;color:#9eacba;font-size:13px}a{color:#6fe0b0;text-decoration:none}@media(max-width:700px){.plans,.form{grid-template-columns:1fr}.submit{grid-column:1}}</style></head><body><main class="w"><a href="/site/">← الرئيسية</a><div class="card"><h1>ابدأ مع Vaultify</h1><p class="muted">اختر الباقة. بعد مراجعة الطلب نصدر لك رابط دفع آمن ومؤقت مرتبط بعرضك أو فاتورتك فقط.</p><div class="plans"><div class="p"><b>Launch</b><div>4,900 تأسيس</div><div class="muted">990 ر.س/شهر</div></div><div class="p"><b>Growth</b><div>7,900 تأسيس</div><div class="muted">1,690 ر.س/شهر</div></div><div class="p"><b>Scale</b><div>9,900 تأسيس</div><div class="muted">2,490 ر.س/شهر</div></div></div><form id="f" class="form"><input name="name" placeholder="الاسم" required><input name="company" placeholder="اسم النشاط"><input name="phone" placeholder="05xxxxxxxx" inputmode="tel"><input name="email" placeholder="البريد" type="email"><select name="plan"><option>Launch</option><option>Growth</option><option>Scale</option></select><select name="monthly_leads"><option value="0">حجم العملاء المحتملين</option><option value="20">أقل من 50</option><option value="100">50–200</option><option value="500">200–1000</option><option value="1500">1000+</option></select><input name="website" style="display:none" tabindex="-1"><button class="submit" type="submit">اطلب رابط الدفع الآمن</button><div id="s" class="status">لن يتم إنشاء أي عملية دفع قبل مراجعة الطلب وربطه بعرض محدد.</div></form></div></main><script>const f=document.getElementById('f'),s=document.getElementById('s');f.addEventListener('submit',async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(f).entries());if(!x.phone&&!x.email){s.textContent='أدخل رقم الجوال أو البريد.';return}s.textContent='جارٍ تسجيل الطلب...';try{const r=await fetch('https://ittixiicaeizihyzawju.supabase.co/functions/v1/site-lead',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...x,business_type:'Purchase Request',goal:'طلب رابط دفع آمن - الباقة: '+x.plan,monthly_leads:Number(x.monthly_leads||0),locale:'ar',page:location.pathname,utm:Object.fromEntries(new URLSearchParams(location.search))})});if(!r.ok)throw new Error();s.textContent='تم استلام طلبك ✓ وسيتم تجهيز رابط الدفع الآمن بعد المراجعة.';f.reset()}catch{s.textContent='تعذر الإرسال الآن. حاول مرة أخرى.'}});</script></body></html>
