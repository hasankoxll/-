<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Vaultify | نتيجة الدفع</title><style>:root{--bg:#071217;--p:#0d1b21;--l:#203941;--t:#eef7f4;--m:#8fa5aa;--g:#6ee7b7;--w:#f6c66e;--r:#ff8a93}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#12382d 0,transparent 28%),var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.box{width:min(92vw,620px);background:linear-gradient(180deg,#10252b,#0b1b20);border:1px solid var(--l);border-radius:22px;padding:28px;text-align:center}.brand{font-size:25px;font-weight:900;color:var(--g)}.icon{font-size:54px;margin:22px 0}.msg{color:var(--m);line-height:1.8}.meta{margin-top:18px;padding:14px;border:1px solid var(--l);border-radius:14px;color:#c9d8da}.btn{display:block;text-decoration:none;margin-top:20px;padding:13px;border-radius:12px;background:var(--g);color:#052019;font-weight:900}.warn{color:var(--w)}.bad{color:var(--r)}</style></head><body><div class="box"><div class="brand">Vaultify | فولتڤاي</div><div id="icon" class="icon">⏳</div><h1 id="title">جارٍ التحقق من الدفع</h1><div id="msg" class="msg">يتم التحقق من حالة العملية مباشرة من Vaultify.</div><div id="meta" class="meta" style="display:none"></div><a class="btn" href="/">العودة إلى Vaultify</a></div><script>const U='https://ittixiicaeizihyzawju.supabase.co',q=new URLSearchParams(location.search),token=q.get('token'),title=document.getElementById('title'),msg=document.getElementById('msg'),icon=document.getElementById('icon'),meta=document.getElementById('meta');const money=n=>new Intl.NumberFormat('ar-SA').format(Number(n||0))+' ر.س';async function check(){if(!token){icon.textContent='⚠️';title.textContent='رابط غير صالح';msg.textContent='رمز العملية غير موجود.';return}try{const r=await fetch(U+'/functions/v1/moyasar-public-status?token='+encodeURIComponent(token),{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'status_failed');meta.style.display='block';meta.textContent=`${j.plan_id} · ${money(j.amount)} · ${String(j.currency||'SAR').trim()}`;if(j.status==='paid'){icon.textContent='✅';title.textContent='تم الدفع بنجاح';msg.textContent='تم تأكيد العملية داخل Vaultify وتحديث الاشتراك.';return}if(['failed','expired','cancelled'].includes(j.status)){icon.textContent='❌';title.textContent='لم يكتمل الدفع';title.className='bad';msg.textContent='الحالة: '+j.status;return}icon.textContent='⏳';title.textContent='الدفع قيد المعالجة';title.className='warn';msg.textContent='الحالة الحالية: '+j.status+'. يتم تحديثها تلقائيًا.';setTimeout(check,2500)}catch(e){icon.textContent='⚠️';title.textContent='تعذر التحقق الآن';title.className='warn';msg.textContent='لن نعتبر العملية ناجحة حتى يؤكدها النظام.'}}check();</script></body></html>
