<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Vaultify | نتيجة الدفع</title><style>:root{--bg:#071217;--p:#0d1b21;--l:#203941;--t:#eef7f4;--m:#8fa5aa;--g:#6ee7b7;--w:#f6c66e;--r:#ff8a93}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#12382d 0,transparent 28%),var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.box{width:min(92vw,620px);background:linear-gradient(180deg,#10252b,#0b1b20);border:1px solid var(--l);border-radius:22px;padding:28px;text-align:center}.brand{font-size:25px;font-weight:900;color:var(--g)}.icon{font-size:54px;margin:22px 0}.msg{color:var(--m);line-height:1.8}.btn{display:block;text-decoration:none;margin-top:20px;padding:13px;border-radius:12px;background:var(--g);color:#052019;font-weight:900}.warn{color:var(--w)}.bad{color:var(--r)}</style></head><body><div class="box"><div class="brand">Vaultify | فولتڤاي</div><div id="icon" class="icon">⏳</div><h1 id="title">جارٍ التحقق من الدفع</h1><div id="msg" class="msg">لن نفعّل الاشتراك اعتمادًا على صفحة الرجوع فقط. يجري التحقق من ميسر Server-side.</div><a class="btn" href="/dashboard#billing">العودة إلى لوحة Vaultify</a></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const URL='https://ittixiicaeizihyzawju.supabase.co',KEY='sb_publishable_SIlfF6-ctdJL2WTg3eTlKQ_5F3LKsSl',sb=createClient(URL,KEY,{auth:{persistSession:true,detectSessionInUrl:true}}),q=new URLSearchParams(location.search);const intent=q.get('intent')||sessionStorage.getItem('vaultify_last_intent'),title=document.getElementById('title'),msg=document.getElementById('msg'),icon=document.getElementById('icon');async function run(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='/login-v2.html';return}if(!intent){title.textContent='لم نجد مرجع العملية';msg.textContent='ارجع إلى صفحة الاشتراك وابدأ عملية دفع جديدة.';icon.textContent='⚠️';return}try{const r=await fetch(URL+'/functions/v1/moyasar-checkout-status',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({intent_id:intent})}),j=await r.json();if(!r.ok)throw new Error(j.error||'verification_failed');if(j.status==='paid'){icon.textContent='✅';title.textContent='تم التحقق من الدفع';msg.textContent='تم تأكيد العملية من ميسر وتحديث الاشتراك والفاتورة داخل Vaultify.'}else if(['failed','expired','canceled','voided'].includes(j.status)){icon.textContent='❌';title.textContent='لم يكتمل الدفع';title.className='bad';msg.textContent='الحالة لدى ميسر: '+j.status+'. لم يتم تفعيل الاشتراك.'}else{icon.textContent='⏳';title.textContent='الدفع ما زال قيد المعالجة';title.className='warn';msg.textContent='الحالة لدى ميسر: '+j.status+'. يمكنك العودة للوحة وسنعتمد النتيجة بعد التحقق.'}}catch(e){icon.textContent='⚠️';title.textContent='تعذر التحقق الآن';title.className='warn';msg.textContent='لم نعتبر الدفع ناجحًا. '+e.message}}run();</script></body></html>
